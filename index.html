<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f3f3f3;
        }
        h1 {
            color: #333;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin: 20px auto;
            width: 310px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }
        .cell.taken {
            pointer-events: none;
            color: #555;
        }
        #message {
            font-size: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
        }
        .choice-container {
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="choice-container">
        <label for="playerChoice">Choose your symbol: </label>
        <select id="playerChoice" onchange="setPlayerSymbol(this.value)">
            <option value="X" selected>X</option>
            <option value="O">O</option>
        </select>
        <br><br>
        <label for="difficulty">Select Difficulty: </label>
        <select id="difficulty" onchange="setDifficulty(this.value)">
            <option value="easy" selected>Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
    </div>
    <div class="board" id="board"></div>
    <div id="message"></div>
    <button onclick="resetGame()">Restart Game</button>

    <script>
        const boardElement = document.getElementById('board');
        const messageElement = document.getElementById('message');
        let board = ['', '', '', '', '', '', '', '', ''];
        let playerSymbol = 'X';
        let computerSymbol = 'O';
        let currentPlayer = 'X';
        let gameActive = true;
        let difficulty = 'easy';

        function setPlayerSymbol(symbol) {
            playerSymbol = symbol;
            computerSymbol = symbol === 'X' ? 'O' : 'X';
            resetGame();
        }

        function setDifficulty(level) {
            difficulty = level;
            resetGame();
        }

        function createBoard() {
            boardElement.innerHTML = '';
            board.forEach((cell, index) => {
                const cellElement = document.createElement('div');
                cellElement.classList.add('cell');
                if (cell) {
                    cellElement.classList.add('taken');
                    cellElement.textContent = cell;
                }
                cellElement.addEventListener('click', () => makeMove(index));
                boardElement.appendChild(cellElement);
            });
        }

        function makeMove(index) {
            if (!gameActive || board[index] !== '') return;

            board[index] = currentPlayer;
            createBoard();

            if (checkWinner(currentPlayer)) {
                messageElement.textContent = `${currentPlayer} wins!`;
                gameActive = false;
                return;
            }

            if (board.every(cell => cell !== '')) {
                messageElement.textContent = `It's a draw!`;
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === playerSymbol ? computerSymbol : playerSymbol;

            if (currentPlayer === computerSymbol) {
                setTimeout(() => {
                    computerMove();
                    createBoard();
                    if (checkWinner(currentPlayer)) {
                        messageElement.textContent = `${currentPlayer} wins!`;
                        gameActive = false;
                        return;
                    }

                    if (board.every(cell => cell !== '')) {
                        messageElement.textContent = `It's a draw!`;
                        gameActive = false;
                        return;
                    }

                    currentPlayer = playerSymbol;
                }, 500);
            }
        }

        function computerMove() {
            const emptyCells = board.map((cell, index) => cell === '' ? index : null).filter(index => index !== null);

            let chosenIndex;
            if (difficulty === 'easy') {
                chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            } else if (difficulty === 'medium') {
                chosenIndex = findBestMove(computerSymbol) || emptyCells[Math.floor(Math.random() * emptyCells.length)];
            } else {
                chosenIndex = findBestMove(computerSymbol);
                if (chosenIndex === null) {
                    chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            }

            board[chosenIndex] = computerSymbol;
        }

        function findBestMove(player) {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let pattern of winPatterns) {
                let [a, b, c] = pattern;
                if (board[a] === player && board[b] === player && board[c] === '') return c;
                if (board[a] === player && board[c] === player && board[b] === '') return b;
                if (board[b] === player && board[c] === player && board[a] === '') return a;
            }

            for (let pattern of winPatterns) {
                let [a, b, c] = pattern;
                if (board[a] === playerSymbol && board[b] === playerSymbol && board[c] === '') return c;
                if (board[a] === playerSymbol && board[c] === playerSymbol && board[b] === '') return b;
                if (board[b] === playerSymbol && board[c] === playerSymbol && board[a] === '') return a;
            }

            return null;
        }

        function checkWinner(player) {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            return winPatterns.some(pattern => pattern.every(index => board[index] === player));
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = playerSymbol;
            gameActive = true;
            messageElement.textContent = '';
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
